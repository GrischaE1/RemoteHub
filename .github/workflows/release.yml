name: Release

# Push a tag like v0.9.1 (or v0.9.1-beta.1): build, test, build both MSIs (RemoteHub, RemoteHub Agent) and publish a GitHub Release.
# The tag is the version; tags below 1.0.0 or with a suffix become pre-releases.
on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

permissions:
  contents: write       # create the release
  id-token: write       # sign the build provenance (Sigstore, through GitHub's OIDC token)
  attestations: write   # store it with the repository's attestations

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    # Releases wait for an approval in release-signing before anything runs, because they use eSigner signings (see
    # "Prepare signing"). Test releases (a suffix) use release-test, which has no reviewers and no secrets.
    environment: ${{ contains(github.ref_name, '-') && 'release-test' || 'release-signing' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The tag name comes in through the environment, never written into the script: a tag is any text its author
      # chose, and inlined it would run as PowerShell.
      - name: Compute version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')            # v0.9.1 -> 0.9.1
          if ($version -notmatch '^(\d+)\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Tag '$env:TAG' is not a version tag like v0.9.1 or v0.9.1-beta.1."
          }
          $prerelease = ([int]$Matches[1] -eq 0 -or $version.Contains('-')).ToString().ToLower()
          $csproj = [xml](Get-Content -Raw src/RemoteHub/RemoteHub.csproj)
          $projectVersion = @($csproj.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($projectVersion -ne $version) {
            "::warning::Tag version $version differs from <Version>$projectVersion</Version> in RemoteHub.csproj. The release uses $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore RemoteHub.sln

      - name: Build
        run: dotnet build RemoteHub.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test RemoteHub.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

      # Code signing through SSL.com eSigner (CodeSignTool), in the environment release-signing: its secrets ES_USERNAME,
      # ES_PASSWORD, ES_CREDENTIAL_ID and ES_TOTP_SECRET, and the variable SIGNING_CERTIFICATE_THUMBPRINT that every
      # signature is checked against. The account has 240 signings a year and a release takes 4 (5 with the credential
      # provider), so only releases sign: CI and the lab never do, and test releases (a suffix: v0.19.1-test.1) are built
      # unsigned. Without the secrets the release is built unsigned, with a warning. The credential provider is never
      # built unsigned (credential-provider-design.md §8.4) - build-installer.ps1 refuses that on its own.
      - name: Prepare signing
        id: signing
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          THUMBPRINT: ${{ vars.SIGNING_CERTIFICATE_THUMBPRINT }}
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG.Contains('-')) { "::notice::Test release $env:TAG - not signed, no signings used."; exit 0 }
          if (-not $env:ES_USERNAME -or -not $env:THUMBPRINT) {
            "::warning::No eSigner account (environment release-signing: secrets ES_*, variable SIGNING_CERTIFICATE_THUMBPRINT) - this release is not signed."
            exit 0
          }
          # CodeSignTool from SSL.com's own repository, pinned by hash like the actions above.
          $zip = Join-Path $env:RUNNER_TEMP 'CodeSignTool.zip'
          Invoke-WebRequest 'https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip' -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a') { throw "CodeSignTool-v1.3.2.zip has the hash $hash, not the pinned one." }
          $tool = Join-Path $env:RUNNER_TEMP 'CodeSignTool'
          Expand-Archive $zip -DestinationPath $tool -Force
          # CodeSignTool 1.3 needs Java 11 or later; the runner's default JAVA_HOME may be Java 8.
          $java = @($env:JAVA_HOME_21_X64, $env:JAVA_HOME_17_X64, $env:JAVA_HOME_11_X64 | Where-Object { $_ })[0]
          if (-not $java) { throw "No Java 11 or later on the runner for CodeSignTool." }
          "tool=$tool" >> $env:GITHUB_OUTPUT
          "java=$java" >> $env:GITHUB_OUTPUT
          "enabled=true" >> $env:GITHUB_OUTPUT

      # A signed release builds the credential provider, whose hardening flags need the Spectre-mitigated libraries
      # (MSB8040), as in ci.yml. Before the first signing, so a missing component can't fail the build halfway.
      - name: Spectre-mitigated libraries
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: ./build/Install-SpectreLibraries.ps1

      # WiX comes from NuGet (WixToolset.Sdk, pinned in the .wixproj), so no tool install is needed.
      - name: Build installer
        shell: pwsh
        env:
          CODE_SIGN_TOOL_PATH: ${{ steps.signing.outputs.tool }}
          JAVA_HOME: ${{ steps.signing.outputs.java || env.JAVA_HOME }}
          ES_USERNAME: ${{ steps.signing.outputs.enabled == 'true' && secrets.ES_USERNAME || '' }}
          ES_PASSWORD: ${{ steps.signing.outputs.enabled == 'true' && secrets.ES_PASSWORD || '' }}
          ES_CREDENTIAL_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.ES_CREDENTIAL_ID || '' }}
          ES_TOTP_SECRET: ${{ steps.signing.outputs.enabled == 'true' && secrets.ES_TOTP_SECRET || '' }}
        run: |
          $sign = if ('${{ steps.signing.outputs.enabled }}' -eq 'true') { @{ SigningCertificate = '${{ vars.SIGNING_CERTIFICATE_THUMBPRINT }}'; ESigner = $true } } else { @{} }
          # The credential provider (automatic sign-in, installed by default) only when the build can sign it: it is never
          # built unsigned (credential-provider-design.md §8.4), and build-installer.ps1 refuses that on its own.
          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') { $sign.CredentialProvider = $true }
          ./build/build-installer.ps1 -Version "${{ steps.version.outputs.version }}" -Configuration Release -OutputPath artifacts @sign

      - name: Locate MSIs
        id: msi
        shell: pwsh
        run: |
          $msi = "artifacts/RemoteHub-${{ steps.version.outputs.version }}-x64.msi"
          $agent = "artifacts/RemoteHub-Agent-${{ steps.version.outputs.version }}-x64.msi"
          foreach ($file in $msi, $agent) {
            if (-not (Test-Path $file)) { throw "$file was not produced - check build-installer.ps1." }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)" | Out-File -Encoding ascii "$file.sha256"
          }
          "path=$msi" >> $env:GITHUB_OUTPUT
          "agent=$agent" >> $env:GITHUB_OUTPUT

      # Group Policy / Intune templates for RemoteHub and the agent (one pair of files for both, docs/admx-design.md §12).
      # Every release carries them next to the MSIs: RemoteHub.admx and RemoteHub.adml (en-US) as they are, and a zip with
      # the PolicyDefinitions layout (RemoteHub.admx, en-US\RemoteHub.adml). A missing or broken template fails the release
      # (the Test step above has already checked them against the code: PolicyTemplateTests).
      - name: Policy templates
        id: policy
        shell: pwsh
        run: |
          $admx = 'policy/RemoteHub.admx'
          $adml = 'policy/en-US/RemoteHub.adml'
          foreach ($file in $admx, $adml) {
            if (-not (Test-Path $file)) { throw "$file is missing - the release must carry the policy templates." }
            try { $xml = [xml](Get-Content $file -Raw) } catch { throw "$file is not valid XML: $($_.Exception.Message)" }
            $root = $xml.DocumentElement.LocalName
            if ($root -notin 'policyDefinitions', 'policyDefinitionResources') { throw "$file has the root <$root>, not an ADMX or ADML." }
          }
          $version = '${{ steps.version.outputs.version }}'
          $zip = "artifacts/RemoteHub-PolicyTemplates-$version.zip"
          Compress-Archive -Path policy/* -DestinationPath $zip -Force
          Copy-Item $admx artifacts/RemoteHub.admx -Force
          Copy-Item $adml artifacts/RemoteHub.adml -Force
          foreach ($file in $zip, 'artifacts/RemoteHub.admx', 'artifacts/RemoteHub.adml') {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)" | Out-File -Encoding ascii "$file.sha256"
          }
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "admx=artifacts/RemoteHub.admx" >> $env:GITHUB_OUTPUT
          "adml=artifacts/RemoteHub.adml" >> $env:GITHUB_OUTPUT

      # What the release is made of (SEC-CI-05): a CycloneDX SBOM of the NuGet packages of RemoteHub and the agent (not
      # the test projects). Components outside NuGet aren't in it: the Virtual Display Driver (third-party\, listed in
      # THIRD-PARTY-NOTICES.md) and the C++ credential provider, which has no packages.
      - name: SBOM
        id: sbom
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'tools'
          dotnet tool install CycloneDX --version 6.3.1 --tool-path $tools
          if ($LASTEXITCODE -ne 0) { throw 'CycloneDX could not be installed.' }
          $name = "RemoteHub-$env:VERSION-sbom.cdx.json"
          & (Join-Path $tools 'dotnet-CycloneDX') RemoteHub.sln --exclude-test-projects --output artifacts --filename $name --output-format Json --set-name RemoteHub --set-version $env:VERSION
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "artifacts/$name")) { throw 'The SBOM was not written.' }
          $file = "artifacts/$name"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "$file.sha256"
          "path=$file" >> $env:GITHUB_OUTPUT

      # Build provenance (SEC-CI-05): GitHub signs which workflow, commit and runner made each file (Sigstore), so a
      # download can be checked with "gh attestation verify <file> -R GrischaE1/RemoteHub" - unlike the .sha256 files,
      # which come from the same place as the file.
      - name: Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.msi.outputs.path }}
            ${{ steps.msi.outputs.agent }}
            ${{ steps.policy.outputs.admx }}
            ${{ steps.policy.outputs.adml }}
            ${{ steps.policy.outputs.zip }}
            ${{ steps.sbom.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: RemoteHub ${{ steps.version.outputs.version }}
          files: |
            ${{ steps.msi.outputs.path }}
            ${{ steps.msi.outputs.path }}.sha256
            ${{ steps.msi.outputs.agent }}
            ${{ steps.msi.outputs.agent }}.sha256
            ${{ steps.policy.outputs.admx }}
            ${{ steps.policy.outputs.admx }}.sha256
            ${{ steps.policy.outputs.adml }}
            ${{ steps.policy.outputs.adml }}.sha256
            ${{ steps.policy.outputs.zip }}
            ${{ steps.policy.outputs.zip }}.sha256
            ${{ steps.sbom.outputs.path }}
            ${{ steps.sbom.outputs.path }}.sha256
          prerelease: ${{ steps.version.outputs.prerelease }}
          body: |
            **Checking a download:** every file has a build provenance signed by GitHub – `gh attestation verify <file> -R GrischaE1/RemoteHub` shows the workflow and commit that made it. `RemoteHub-<version>-sbom.cdx.json` lists the NuGet packages RemoteHub and the agent are built from (CycloneDX).

            **Group Policy / Intune templates** for RemoteHub and the RemoteHub Agent: `RemoteHub.admx` goes into `PolicyDefinitions` (the Central Store, or `%WINDIR%\PolicyDefinitions`), `RemoteHub.adml` into its `en-US` folder – or take `RemoteHub-PolicyTemplates-<version>.zip`, which has that layout. Intune: import `RemoteHub.admx` and `RemoteHub.adml` under *Devices → Configuration → Import ADMX*.
          generate_release_notes: true
          fail_on_unmatched_files: true
