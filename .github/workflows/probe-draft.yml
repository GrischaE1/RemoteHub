name: Probe draft permission
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready "${{ github.event.pull_request.number }}" --undo -R "$GITHUB_REPOSITORY"
