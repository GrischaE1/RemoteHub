name: CLA

# Contributors agree to CLA.md once, by commenting the sentence below on a pull request (CLA Assistant Lite).
# Signatures are kept in signatures/version1/cla.json on the branch "cla-signatures" (not on main, which is protected).
# pull_request_target: runs this file as it is on main – the pull request's own code is never checked out or run.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write        # store the signature on the cla-signatures branch
  pull-requests: write   # ask in the pull request, lock it after merge
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the RemoteHub CLA and I agree to it') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/GrischaE1/RemoteHub/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          # The owner (all their code is theirs anyway) and bots don't sign.
          allowlist: GrischaE1,dependabot[bot],github-actions[bot],bot*
          custom-pr-sign-comment: 'I have read the RemoteHub CLA and I agree to it'
          custom-notsigned-prcomment: 'Thank you for your contribution! Before it can be merged, please read the [RemoteHub Contributor License Agreement](https://github.com/GrischaE1/RemoteHub/blob/main/CLA.md) and agree to it by commenting the sentence below. You only do this once. You keep the copyright to your work; the CLA lets the project also offer it under other license terms (see CONTRIBUTING.md).'
          custom-allsigned-prcomment: 'All contributors have agreed to the RemoteHub CLA. Thank you!'
          signed-commit-message: 'CLA: $contributorName agreed in #$pullRequestNo'
          lock-pullrequest-aftermerge: true
