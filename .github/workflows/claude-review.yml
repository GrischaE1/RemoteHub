name: Claude review

# Reviews a pull request when it is marked ready for review and posts the findings as inline comments. Pushes don't
# trigger a review, so open pull requests as drafts while working; to review again, convert back to a draft and mark
# it ready once more. Review standards come from CLAUDE.md, which pulls in the same instruction files Copilot used.
on:
  pull_request:
    types: [ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# A newer review of the same pull request replaces one still running.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  author:
    # Secrets are not passed to workflows from forks, and the action refuses authors without write access, so
    # pull requests from forks are skipped instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      admin: ${{ steps.permission.outputs.admin }}
    steps:
      - id: permission
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission)
          echo "admin=$([ "$permission" = admin ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  review:
    needs: author
    # Reviews of pull requests by non-admins wait until an admin approves the run (required reviewers on the
    # claude-review-approval environment).
    environment: ${{ needs.author.outputs.admin == 'true' && 'claude' || 'claude-review-approval' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
