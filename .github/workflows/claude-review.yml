name: Claude review

# Reviews a pull request when an admin marks it ready for review and posts the findings as inline comments. Pushes
# don't trigger a review, and neither does a non-admin marking their own pull request ready: an admin converts it to
# a draft and marks it ready to start one. To review again, do the same. Review standards come from CLAUDE.md, which
# pulls in the same instruction files Copilot used.
on:
  pull_request:
    types: [ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# A newer review of the same pull request replaces one still running.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sender:
    # Secrets are not passed to workflows from forks, so pull requests from forks are skipped instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      admin: ${{ steps.permission.outputs.admin }}
    steps:
      - id: permission
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq .permission)
          echo "admin=$([ "$permission" = admin ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  review:
    needs: sender
    # Only an admin marking the pull request ready starts a review.
    if: needs.sender.outputs.admin == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1.0.251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The gh commands the code-review plugin declares; without them it stops after its first step.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"'
