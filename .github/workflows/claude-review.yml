name: Claude review

# Runs when a repository admin adds the claude-review label to a pull request, and posts the findings as inline
# comments. The label is removed afterwards, so adding it again runs another review.
#
# Merging into main requires the claude-review commit status on the pull request's latest commit. Only this workflow
# sets it, and only after the review really ran – a skipped job would count as a passed check, so the job itself is
# not the required check. A push needs a new review. Pull requests from forks can't be reviewed (GitHub doesn't give
# them secrets), so they need an admin to merge them past the rule.
#
# Review standards come from CLAUDE.md, which pulls in the same instruction files Copilot used.
on:
  pull_request:
    types: [labeled]

# A newer review of the same pull request replaces one still running.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # remove the label
      issues: read
      statuses: write        # set the claude-review status
      id-token: write
    steps:
      - name: Check who asked
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq .permission)
          if [ "$permission" != admin ]; then
            echo "::error::Only repository admins can start the Claude review ($SENDER has $permission access)."
            exit 1
          fi
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests from forks can't be reviewed: GitHub doesn't give their workflows secrets."
            exit 1
          fi
          # The plugin skips drafts, and the commit would still be marked as reviewed.
          if [ "$DRAFT" = true ]; then
            echo "::error::Mark the pull request ready for review first."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - id: claude
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1.0.251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # The plugin stops when Claude has commented on the pull request before, which would mark a later commit
          # as reviewed without reviewing it.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            An admin asked for this review. Review the pull request as it is now even if Claude has commented on it
            before – earlier comments may be about older commits. Don't repeat a finding that already has an open
            comment.
          # The gh commands the code-review plugin declares; without them it stops after its first step.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"'

      # The action skips itself and still succeeds when the pull request changes this workflow, so require proof
      # that Claude ran before marking the commit as reviewed.
      - name: Mark the commit as reviewed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ "$CONCLUSION" != success ] || [ -z "$EXECUTION_FILE" ]; then
            echo "::error::Claude didn't run, so the commit isn't marked as reviewed."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=claude-review \
            -f description="Reviewed by Claude" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove the label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/claude-review" --silent || true
