name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest   # WPF and the PowerShell 5.1 based tests need Windows
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RemoteHub.sln

      - name: Build
        run: dotnet build RemoteHub.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RemoteHub.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      # Both MSIs, so a broken installer shows up here and not only when a release is tagged (also runs the agent's selftest).
      - name: Build installers
        shell: pwsh
        run: ./build/build-installer.ps1 -Configuration Release -OutputPath artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore
