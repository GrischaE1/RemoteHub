name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest   # WPF and the PowerShell 5.1 based tests need Windows
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # No package below a version with a known security fix (build/minimum-versions.json; security-test-lab-design.md §8).
      - name: Dependency versions
        shell: pwsh
        run: ./build/Test-DependencyVersions.ps1

      - name: Restore
        run: dotnet restore RemoteHub.sln

      - name: Build
        run: dotnet build RemoteHub.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RemoteHub.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      # The runner's Visual Studio comes without the Spectre-mitigated libraries, which the provider's hardening flags
      # need (MSB8040; credential-provider-design.md §8.1): added here rather than building it without them. The
      # provider builds with v143 (MSVC 14.44 on the image); the unversioned component is for the newer default toolset.
      - name: Spectre-mitigated libraries
        shell: pwsh
        run: ./build/Install-SpectreLibraries.ps1

      # The credential provider (C++, Visual Studio's MSBuild): build with the hardening flags, unit tests, and a
      # minute of fuzzing the pipe message parser (credential-provider-design.md §8.1, §8.3).
      - name: Credential provider
        shell: pwsh
        run: ./build/build-credential-provider.ps1 -Configuration Release -FuzzSeconds 60

      # Both MSIs, so a broken installer shows up here and not only when a release is tagged (also runs the agent's selftest).
      - name: Build installers
        shell: pwsh
        run: ./build/build-installer.ps1 -Configuration Release -OutputPath artifacts

      # Antivirus, part 1: Microsoft Defender over the MSIs and the publish folders (the files the MSIs are made from).
      # The runner image excludes its drives from Defender, so the exclusions go first; a test file (EICAR, put
      # together here so it is never in the repository) proves the scan really finds something before the real one.
      - name: Defender scan
        shell: pwsh
        run: |
          $mp = Get-MpPreference
          if ($mp.ExclusionPath) { Remove-MpPreference -ExclusionPath $mp.ExclusionPath }
          if ($mp.ExclusionExtension) { Remove-MpPreference -ExclusionExtension $mp.ExclusionExtension }
          if ($mp.ExclusionProcess) { Remove-MpPreference -ExclusionProcess $mp.ExclusionProcess }
          $cmd = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          & $cmd -SignatureUpdate
          if ($LASTEXITCODE -ne 0) { "::warning::Defender signature update exited with $LASTEXITCODE - scanning with the image's signatures." }

          $probe = Join-Path $env:RUNNER_TEMP 'av-probe'
          New-Item -ItemType Directory -Force $probe | Out-Null
          $eicar = 'X5O!P%@AP[4\PZX54(P^)7CC)7}$' + 'EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'
          [IO.File]::WriteAllText((Join-Path $probe 'eicar.txt'), $eicar)
          & $cmd -Scan -ScanType 3 -File $probe -DisableRemediation | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "Defender did not detect the EICAR test file (exit code $LASTEXITCODE) - the scan below would prove nothing." }
          Remove-Item $probe -Recurse -Force

          & $cmd -Scan -ScanType 3 -File (Resolve-Path artifacts) -DisableRemediation
          switch ($LASTEXITCODE) {
            0 { 'Defender: no threats found.' }
            2 { Get-MpThreatDetection | Format-List; throw 'Defender found a threat in the build output.' }
            default { throw "Defender scan failed (exit code $LASTEXITCODE)." }
          }

      - name: Upload installers for the antivirus scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          path: artifacts/
          retention-days: 3

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  # Antivirus, part 2: ClamAV, a second engine, over the same build output. Same EICAR self-check as Defender.
  clamav-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers
          path: artifacts

      # Cisco-Talos' own package of a pinned version, checked against the SHA-256 GitHub publishes for it – not whatever
      # the distribution's archive has (Ubuntu's lags behind ClamAV's security releases). Raise both together.
      - name: Install ClamAV and update signatures
        env:
          CLAMAV_VERSION: 1.5.4
          CLAMAV_SHA256: 28d6efc5b4423e7830c3559339552eb53870a9eac51ac4efb37d60530d329886
        run: |
          deb="$RUNNER_TEMP/clamav.deb"
          curl -fsSL -o "$deb" "https://github.com/Cisco-Talos/clamav/releases/download/clamav-$CLAMAV_VERSION/clamav-$CLAMAV_VERSION.linux.x86_64.deb"
          echo "$CLAMAV_SHA256  $deb" | sha256sum --check --strict
          sudo dpkg -i "$deb"
          clamscan --version | grep -F "ClamAV $CLAMAV_VERSION" || { echo "::error::clamscan is not ClamAV $CLAMAV_VERSION"; exit 1; }
          db="$RUNNER_TEMP/clamav-db"; mkdir -p "$db"
          printf 'DatabaseDirectory %s\nDatabaseMirror database.clamav.net\n' "$db" > "$RUNNER_TEMP/freshclam.conf"
          freshclam --config-file="$RUNNER_TEMP/freshclam.conf"
          echo "CLAMAV_DB=$db" >> "$GITHUB_ENV"

      # The limits are raised so the MSIs (cabinets inside) are scanned whole and not skipped for their size.
      - name: Scan
        run: |
          limits="--database=$CLAMAV_DB --max-filesize=2000M --max-scansize=4000M --max-files=100000 --max-recursion=30"
          probe="$RUNNER_TEMP/av-probe"; mkdir -p "$probe"
          printf '%s%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$' 'EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > "$probe/eicar.txt"
          rc=0; clamscan --no-summary $limits "$probe/eicar.txt" > /dev/null || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::ClamAV did not detect the EICAR test file - the scan below would prove nothing (exit code $rc)."; exit 1
          fi
          rm -rf "$probe"
          clamscan --recursive --infected $limits artifacts/

  # The workflows themselves (SEC-CI-02, SEC-CI-03; security-test-lab-design.md §8): actionlint, then the project's own
  # rules - nothing from github.* or inputs.* written into a script, every action pinned to a commit SHA, no checkout
  # under pull_request_target. actionlint is rhysd's release, checked against the SHA-256 in its checksums file.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tgz="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$tgz" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $tgz" | sha256sum --check --strict
          tar -xzf "$tgz" -C "$RUNNER_TEMP" actionlint
          # The scripts are PowerShell or short shell lines: shellcheck's and pyflakes' style findings are left out.
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=

      - name: Project rules
        shell: pwsh
        run: ./build/Test-Workflows.ps1
