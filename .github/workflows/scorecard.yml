name: Scorecard

# OpenSSF Scorecard: checks the repository's supply-chain practices (pinned actions, token permissions, branch
# protection, code review, signed releases …) and lists what falls short under Security > Code scanning. The results
# stay in this repository; they're not published to the OpenSSF API (publish_results), so there's no public badge.
on:
  push:
    branches: [ main ]
  branch_protection_rule:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard
